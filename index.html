<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ASMR Doodle Pad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      background: #fafafd;
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
      color: #333;
      touch-action: none;
    }

    #header-bar {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .header-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 26px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .icon-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.05); }
    .icon-btn:disabled { opacity: 0.3; transform: none; }

    .clear-btn {
      color: #ff3b30;
      padding: 0 16px;
      width: auto;
      font-family: inherit;
      font-size: 14px;
    }

    canvas {
      position: absolute;
      left: 0;
      background: #fafafd;
      opacity: 1;
      touch-action: none;
      transition: opacity 0.15s ease;
    }
    canvas.clearing { opacity: 0.2; }

    #bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 12px 16px calc(env(safe-area-inset-bottom, 12px) + 8px) 16px;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.06);
      border-top: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .scroll-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .scroll-row::-webkit-scrollbar { display: none; }

    .color-btn {
      min-width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
    }
    .color-btn.active {
      transform: scale(1.12);
      border-color: #222;
      box-shadow: 0 0 0 2px #ffffff, 0 3px 8px rgba(0,0,0,0.3);
    }

    .pill-group {
      display: flex;
      background: #eef1f6;
      padding: 3px;
      border-radius: 24px;
      gap: 2px;
      flex-shrink: 0;
    }
    .pill-btn {
      min-height: 44px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 22px;
      background: transparent;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      transition: all 0.15s ease;
    }
    .pill-btn.active {
      background: #ffffff;
      color: #111;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .slider-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eef1f6;
      padding: 6px 14px;
      border-radius: 24px;
      min-height: 52px;
    }

    #brush-preview-container {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #brush-preview {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #222;
      transition: width 0.1s ease, height 0.1s ease;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      touch-action: pan-x;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #dcdfe6;
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 28px;
      width: 28px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #333333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -11px;
    }

    @media (min-width: 720px) {
      #bottom-sheet {
        left: 50%;
        right: auto;
        width: min(560px, calc(100% - 32px));
        transform: translateX(-50%);
        bottom: 16px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.8);
      }
    }
  </style>
</head>
<body>

  <div id="header-bar">
    <div class="header-group">
      <button class="icon-btn" id="undo-btn" onclick="undo()" disabled title="Undo">↩️</button>
      <button class="icon-btn" id="redo-btn" onclick="redo()" disabled title="Redo">↪️</button>
    </div>
    <div class="header-group">
      <button class="icon-btn clear-btn" onclick="clearCanvas()">Clear</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="bottom-sheet">
    <div class="scroll-row">
      <button class="color-btn active" style="background: #222222;" onclick="setColor('#222222', this)"></button>
      <button class="color-btn" style="background: #ff3b30;" onclick="setColor('#ff3b30', this)"></button>
      <button class="color-btn" style="background: #ff9500;" onclick="setColor('#ff9500', this)"></button>
      <button class="color-btn" style="background: #34c759;" onclick="setColor('#34c759', this)"></button>
      <button class="color-btn" style="background: #007aff;" onclick="setColor('#007aff', this)"></button>
      <button class="color-btn" style="background: #5856d6;" onclick="setColor('#5856d6', this)"></button>
      <div class="pill-group">
        <button class="pill-btn active" onclick="setMedium('MARKER', this)">Marker</button>
        <button class="pill-btn" onclick="setMedium('CHALK', this)">Chalk</button>
        <button class="pill-btn" onclick="setMedium('CHARCOAL', this)">Charcoal</button>
        <button class="pill-btn" onclick="setMedium('PENCIL', this)">Pencil</button>
      </div>
    </div>

    <div class="control-row">
      <div class="pill-group">
        <button class="pill-btn active" onclick="setMode('DRAW', this)">✏️ Draw</button>
        <button class="pill-btn" onclick="setMode('TRIANGLE', this)">▲</button>
        <button class="pill-btn" onclick="setMode('RECT', this)">■</button>
        <button class="pill-btn" onclick="setMode('CIRCLE', this)">●</button>
      </div>

      <div class="slider-container">
        <div id="brush-preview-container">
          <div id="brush-preview"></div>
        </div>
        <input type="range" id="size" min="2" max="50" value="10" oninput="updateSizePreview(this.value)">
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const headerBar = document.getElementById('header-bar');
    const bottomSheet = document.getElementById('bottom-sheet');

    let isInteracting = false;
    let currentMode = 'DRAW';
    let currentColor = '#222222';
    let currentMedium = 'MARKER';

    let startPos = { x: 0, y: 0 };
    let lastPos = { x: 0, y: 0 };
    let canvasSnapshot = null;

    const undoStack = [];
    const redoStack = [];
    const MAX_HISTORY = 25;

    function saveState() {
      if (undoStack.length >= MAX_HISTORY) undoStack.shift();
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      redoStack.length = 0;
      updateHistoryButtons();
    }

    function undo() {
      if (undoStack.length === 0) return;
      redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      const previousState = undoStack.pop();
      ctx.putImageData(previousState, 0, 0);
      updateHistoryButtons();
    }

    function redo() {
      if (redoStack.length === 0) return;
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      const nextState = redoStack.pop();
      ctx.putImageData(nextState, 0, 0);
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      document.getElementById('undo-btn').disabled = undoStack.length === 0;
      document.getElementById('redo-btn').disabled = redoStack.length === 0;
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let noiseNode = null;
    let filterNode = null;
    let gainNode = null;

    function createNoiseBuffer() {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
      return buffer;
    }
    const noiseBuffer = createNoiseBuffer();

    function startASMRSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = noiseBuffer;
      noiseNode.loop = true;

      filterNode = audioCtx.createBiquadFilter();
      gainNode = audioCtx.createGain();

      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

      noiseNode.connect(filterNode);
      filterNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      noiseNode.start();
    }

    function updateASMRSound(speed) {
      if (!gainNode || !filterNode) return;
      const now = audioCtx.currentTime;
      const normSpeed = Math.min(Math.max(speed, 0), 25);

      if (currentMedium === 'MARKER') {
        filterNode.type = 'bandpass';
        filterNode.frequency.setValueAtTime(600 + normSpeed * 80, now);
        filterNode.Q.setValueAtTime(1.8, now);
        gainNode.gain.setTargetAtTime(Math.min(normSpeed * 0.015, 0.08), now, 0.05);
      } else if (currentMedium === 'CHALK') {
        filterNode.type = 'lowpass';
        filterNode.frequency.setValueAtTime(800 + normSpeed * 120, now);
        filterNode.Q.setValueAtTime(0.7, now);
        gainNode.gain.setTargetAtTime(Math.min(normSpeed * 0.02, 0.12), now, 0.04);
      } else if (currentMedium === 'CHARCOAL') {
        filterNode.type = 'bandpass';
        filterNode.frequency.setValueAtTime(350 + normSpeed * 50, now);
        filterNode.Q.setValueAtTime(0.6, now);
        gainNode.gain.setTargetAtTime(Math.min(normSpeed * 0.025, 0.14), now, 0.04);
      } else {
        filterNode.type = 'bandpass';
        filterNode.frequency.setValueAtTime(1600 + normSpeed * 100, now);
        filterNode.Q.setValueAtTime(0.5, now);
        gainNode.gain.setTargetAtTime(Math.min(normSpeed * 0.01, 0.06), now, 0.05);
      }
    }

    function stopASMRSound() {
      if (gainNode) {
        gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
        setTimeout(() => {
          if (noiseNode) {
            try { noiseNode.stop(); } catch(e) {}
            noiseNode.disconnect();
          }
        }, 100);
      }
    }

    function playTechnicalClearSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const techGain = audioCtx.createGain();

      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(780, now);
      osc1.frequency.exponentialRampToValueAtTime(110, now + 0.1);
      osc2.frequency.setValueAtTime(1560, now);
      osc2.frequency.exponentialRampToValueAtTime(220, now + 0.1);

      techGain.gain.setValueAtTime(0.08, now);
      techGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      osc1.connect(techGain);
      osc2.connect(techGain);

      const clickOsc = audioCtx.createOscillator();
      const clickGain = audioCtx.createGain();
      clickOsc.type = 'square';
      clickOsc.frequency.setValueAtTime(2000, now);
      clickGain.gain.setValueAtTime(0.04, now);
      clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.012);

      clickOsc.connect(clickGain);
      clickGain.connect(audioCtx.destination);
      techGain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      clickOsc.start(now);

      osc1.stop(now + 0.1);
      osc2.stop(now + 0.1);
      clickOsc.stop(now + 0.012);
    }

    function resize() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      if (canvas.width > 0) tempCtx.drawImage(canvas, 0, 0);

      const headerBottom = Math.ceil(headerBar.getBoundingClientRect().bottom + 8);
      const sheetTop = Math.floor(bottomSheet.getBoundingClientRect().top);
      const width = window.innerWidth;
      const height = Math.max(120, sheetTop - headerBottom);

      canvas.style.top = `${headerBottom}px`;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      canvas.width = width;
      canvas.height = height;

      if (tempCanvas.width > 0) ctx.drawImage(tempCanvas, 0, 0);
    }

    window.addEventListener('resize', resize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
    }
    window.addEventListener('load', resize);
    requestAnimationFrame(resize);

    function setColor(color, btn) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('brush-preview').style.background = color;
    }

    function setMode(mode, btn) {
      currentMode = mode;
      const group = btn.parentElement;
      group.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function setMedium(medium, btn) {
      currentMedium = medium;
      const group = btn.parentElement;
      group.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function updateSizePreview(val) {
      const preview = document.getElementById('brush-preview');
      preview.style.width = `${val}px`;
      preview.style.height = `${val}px`;
    }

    function clearCanvas() {
      saveState();
      playTechnicalClearSound();
      canvas.classList.add('clearing');
      setTimeout(() => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.classList.remove('clearing');
      }, 100);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
      const clientX = touch ? touch.clientX : e.clientX;
      const clientY = touch ? touch.clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function applyBrushStyles() {
      ctx.strokeStyle = currentColor;
      ctx.fillStyle = currentColor;
      ctx.lineWidth = document.getElementById('size').value;

      if (currentMedium === 'MARKER') {
        ctx.globalAlpha = 0.85; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      } else if (currentMedium === 'CHALK') {
        ctx.globalAlpha = 0.5; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
      } else if (currentMedium === 'CHARCOAL') {
        ctx.globalAlpha = 0.35; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      } else {
        ctx.globalAlpha = 0.9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      }
    }

    function drawShape(from, to, mode) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;

      ctx.beginPath();
      if (mode === 'RECT') {
        ctx.rect(from.x, from.y, dx, dy);
      } else if (mode === 'CIRCLE') {
        const radius = Math.sqrt(dx * dx + dy * dy);
        ctx.arc(from.x, from.y, radius, 0, Math.PI * 2);
      } else if (mode === 'TRIANGLE') {
        ctx.moveTo(from.x, from.y - dy);
        ctx.lineTo(from.x - dx, from.y + dy);
        ctx.lineTo(from.x + dx, from.y + dy);
        ctx.closePath();
      }
      ctx.stroke();
    }

    function startInteraction(e) {
      if (e.target.closest('#bottom-sheet') || e.target.closest('#header-bar')) return;

      saveState();
      isInteracting = true;
      const pos = getPos(e);
      startPos = pos;
      lastPos = pos;

      startASMRSound();

      if (currentMode === 'DRAW') {
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      } else {
        canvasSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }
    }

    function moveInteraction(e) {
      if (!isInteracting) return;
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);

      const dx = pos.x - lastPos.x;
      const dy = pos.y - lastPos.y;
      const speed = Math.sqrt(dx * dx + dy * dy);
      updateASMRSound(speed);

      applyBrushStyles();

      if (currentMode === 'DRAW') {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        ctx.putImageData(canvasSnapshot, 0, 0);
        drawShape(startPos, pos, currentMode);
      }

      lastPos = pos;
    }

    function stopInteraction() {
      if (isInteracting) {
        stopASMRSound();
      }
      isInteracting = false;
      canvasSnapshot = null;
    }

    canvas.addEventListener('mousedown', startInteraction);
    canvas.addEventListener('mousemove', moveInteraction);
    canvas.addEventListener('mouseup', stopInteraction);
    canvas.addEventListener('mouseleave', stopInteraction);

    canvas.addEventListener('touchstart', startInteraction, { passive: true });
    canvas.addEventListener('touchmove', moveInteraction, { passive: false });
    canvas.addEventListener('touchend', stopInteraction);

    updateSizePreview(document.getElementById('size').value);
  </script>
</body>
</html>
